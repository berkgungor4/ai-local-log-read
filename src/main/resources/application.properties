# OLLAMA BAĞLANTI AYARLARI

# Lokal Ollama sunucusunun adresi (varsayılan port: 11434)
spring.ai.openai.base-url=http://localhost:11434/v1

# Ollama API key istemez ancak Spring AI OpenAI istemcisi
# boş key ile çalışmadığı için sahte bir değer veriyoruz.
spring.ai.openai.api-key=ollama

# Kullanılacak model. Lokal ortamda düşük gecikme + makul doğruluk dengesi için tercih edildi.
spring.ai.openai.chat.model=llama3.2:3b

# Temperature düşük tutuldu (0.2): log analizi gibi tutarlılık
# gerektiren görevlerde modelin "yaratıcı" değil "deterministik" cevaplar üretmesi istiyoruz.
spring.ai.openai.chat.temperature=0.2

# Modelin üretebileceği maksimum token sayısı. Çok uzun cevapları engelleyip yanıt süresini öngörülebilir kılar.
spring.ai.openai.chat.max-tokens=1024

# Ollama sunucusuna bağlantı kurma süresi limiti
spring.ai.openai.rest-client.connect-timeout=10s

# Modelin cevap üretme süresi limiti. Lokal modelde CPU/GPU'ya
# bağlı olarak değişebileceği için biraz toleranslı tutuldu.
spring.ai.openai.rest-client.read-timeout=30s

# Metni vektöre çevirmek için kullanılan ayrı ve daha hafif bir model.
spring.ai.openai.embedding.base-url=http://localhost:11434/v1
spring.ai.openai.embedding.api-key=ollama
spring.ai.openai.embedding.model=nomic-embed-text